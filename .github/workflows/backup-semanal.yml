name: Backup semanal Sellaflex

on:
  schedule:
    # Domingo às 09:00 no horário de Recife (12:00 UTC)
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Exportar banco e tabelas
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Falta configurar o segredo SUPABASE_DB_URL no GitHub."
            exit 1
          fi

          mkdir -p backup
          DATA="$(date -u +%Y-%m-%d)"

          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges --format=plain | gzip -9 > "backup/Sellaflex_Banco_${DATA}.sql.gz"

          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "\\copy (select * from public.vendas order by id) to 'backup/Vendas_${DATA}.csv' csv header"
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "\\copy (select * from public.clientes_potenciais order by id) to 'backup/Clientes_Potenciais_${DATA}.csv' csv header"

          test -s "backup/Sellaflex_Banco_${DATA}.sql.gz"
          test -s "backup/Vendas_${DATA}.csv"
          test -s "backup/Clientes_Potenciais_${DATA}.csv"

      - name: Guardar cópia temporária do backup
        uses: actions/upload-artifact@v4
        with:
          name: sellaflex-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
