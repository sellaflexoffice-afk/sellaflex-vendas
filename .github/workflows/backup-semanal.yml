name: Backup semanal Sellaflex

on:
  schedule:
    # Domingo às 09:00 no horário de Recife (12:00 UTC)
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar ferramentas PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Exportar banco e tabelas
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Falta configurar o segredo SUPABASE_DB_URL no GitHub."
            exit 1
          fi

          mkdir -p backup
          DATA="$(date -u +%Y-%m-%d)"

          pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges --format=plain | gzip -9 > "backup/Sellaflex_Banco_${DATA}.sql.gz"

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "\\copy (select * from public.vendas order by id) to 'backup/Vendas_${DATA}.csv' csv header"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "\\copy (select * from public.clientes_potenciais order by id) to 'backup/Clientes_Potenciais_${DATA}.csv' csv header"

          test -s "backup/Sellaflex_Banco_${DATA}.sql.gz"
          test -s "backup/Vendas_${DATA}.csv"
          test -s "backup/Clientes_Potenciais_${DATA}.csv"

      - name: Guardar cópia temporária do backup
        uses: actions/upload-artifact@v4
        with:
          name: sellaflex-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
